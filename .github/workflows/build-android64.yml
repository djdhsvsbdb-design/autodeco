# Android 64-bit CI for Alt3rDECO.
name: Build Alt3rDECO (Android 64-bit)
on:
  push:
    branches:
      - alt3rdeco-v2
    paths-ignore:
      - '**.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android64:
    name: Build Geode mod for Android 64-bit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Remove stale local CMake build cache
        run: rm -rf build
      - name: Build with Geode SDK
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          build-config: Release
      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alt3rDECO-2.0.0-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 14
