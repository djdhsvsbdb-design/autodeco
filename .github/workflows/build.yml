name: Build Geode mod

on:
  push:
    branches:
      - v3.0-ai-decorator
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows (Geode 5.11.2)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove local build cache
        shell: pwsh
        run: if (Test-Path build) { Remove-Item -Recurse -Force build }

      - name: Build mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Win64
          build-config: Release

      - name: Upload Windows .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoDecoratorAI-Windows
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error

  build-android:
    name: Build Android arm64 (Geode 5.11.2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove local build cache
        run: rm -rf build

      - name: Build mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          build-config: Release

      - name: Upload Android .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoDecoratorAI-Android-arm64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
