name: Build Alt3rDECO (Windows)
on:
  push:
    branches:
      - alt3rdeco-v2
    paths-ignore:
      - '**.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-win64:
    name: Build Geode mod for Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build with Geode SDK
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Win64
          build-config: Release
      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alt3rDECO-2.0.0-Windows
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 14